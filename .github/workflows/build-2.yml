name: Biên dịch kernel cho redmi 9A

on:
  workflow_dispatch:

jobs:
  build_kernel:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Install Build Essentials
      run: |
        sudo apt update
        # Cài đặt các thư viện hệ thống và Toolchain 64-bit tiêu chuẩn
        sudo apt install -y git bc bison flex libssl-dev make \
        libc6-dev libncurses5-dev gcc-aarch64-linux-gnu \
        curl build-essential wget zip unzip

    - name: Cấu hình liên kết Python2 nội bộ vào hệ thống
      run: |
        PYTHON2_BIN="$GITHUB_WORKSPACE/toolchains/python2/bin/python2.7"
        
        if [ ! -f "$PYTHON2_BIN" ]; then
          # Kiểm tra dự phòng nếu file thực thi tên là 'python' thay vì 'python2.7'
          PYTHON2_BIN="$GITHUB_WORKSPACE/toolchains/python2/bin/python"
        fi

        if [ ! -f "$PYTHON2_BIN" ]; then
          echo "[-] LỖI NGHIÊM TRỌNG: Không tìm thấy Python2 tại toolchains/python2/bin!"
          exit 1
        fi

        # Tạo liên kết mềm hệ thống trỏ thẳng vào Python2 nội bộ
        sudo ln -sf "$PYTHON2_BIN" /usr/bin/python
        sudo ln -sf "$PYTHON2_BIN" /usr/bin/python2
        
        echo "[+] Đã cấu hình Python2 nội bộ thành công:"
        python --version

    - name: Cấu hình biến môi trường PATH
      run: |
        echo "$GITHUB_WORKSPACE/toolchains/clang/bin" >> $GITHUB_PATH
        echo "$GITHUB_WORKSPACE/toolchains/python2/bin" >> $GITHUB_PATH

    - name: Compile Kernel Siêu Tối Giản
      run: |
        if [ ! -f "$GITHUB_WORKSPACE/toolchains/clang/bin/clang" ]; then
          echo "[-] LỖI: Không tìm thấy Clang tại toolchains/clang/!"
          exit 1
        fi

        if [ -f "drivers/char/rpmb/rpmb-mtk.c" ]; then
          git checkout -- drivers/char/rpmb/rpmb-mtk.c
        fi

        # Nạp đường dẫn Clang và Python2 vào PATH
        export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$GITHUB_WORKSPACE/toolchains/python2/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        
        export CC=clang
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CLANG_TRIPLE=aarch64-linux-gnu-
        
        export HOSTCFLAGS="-fcommon"
        mkdir -p out

        # 1. Tìm file config ở gốc và copy đổi tên thành out/.config để nạp cấu hình
        if [ -f "config" ]; then
          cp config out/.config
          echo "[+] Đã tìm thấy file 'config' gốc và nạp vào thư mục build!"
        else
          echo "[-] LỖI: Không tìm thấy file cấu hình tên 'config' ở thư mục gốc để biên dịch!"
          exit 1
        fi

        # 2. Đồng bộ lại cấu hình vừa nạp
        make O=out olddefconfig

        # 3. Tiến hành biên dịch và ĐẶT TÊN BIÊN DỊCH (LOCALVERSION)
        make -j$(nproc --all) O=out \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          HOSTCFLAGS="-fcommon" \
          LOCALVERSION="-KSU-Redmi9A" \
          EXTRAVERSION=""

    - name: Kiểm tra File Kernel Image
      if: success()
      run: |
        if [ -f out/arch/arm64/boot/Image ]; then
          echo "[+] Tìm thấy file Image nguyên bản thành công!"
        else
          echo "[-] LỖI: Không tìm thấy file Image tại out/arch/arm64/boot/!"
          exit 1
        fi

    - name: Upload Kernel File
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-KSU.zip
        path: out/arch/arm64/boot/Image
