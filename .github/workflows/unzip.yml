name: Extract Imgsensor and Push

on:
  workflow_dispatch: # Chỉ chạy thủ công từ giao diện GitHub UI

permissions:
  contents: write   # Cấp quyền ghi để push code lên repository

jobs:
  extract-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete old imgsensor directory
        run: |
          echo "Removing old imgsensor directory..."
          rm -rf drivers/misc/mediatek/imgsensor

      - name: Extract imgsensor.zip
        run: |
          echo "Unzipping imgsensor.zip..."
          unzip -o drivers/misc/mediatek/imgsensor.zip -d drivers/misc/mediatek/

      - name: Commit and Push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          
          if git diff-index --quiet HEAD; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "chore: remove imgsensor dir and extract imgsensor.zip"
            git push
          fi
