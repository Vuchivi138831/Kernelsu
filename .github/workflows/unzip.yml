name: Unzip Camera Drivers

on:
  workflow_dispatch: # Chỉ chạy thủ công, không tự động

jobs:
  extract_and_push:
    runs-on: ubuntu-latest

    # Cấp quyền ghi vào repository để thực hiện git push
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Xóa thư mục cũ và giải nén camera.zip
        run: |
          CD_DIR="drivers/misc/mediatek"
          cd $CD_DIR

          # Xóa hai thư mục cũ nếu tồn tại
          echo "[+] Đang xóa thư mục flashlight và imgsensor cũ..."
          rm -rf flashlight imgsensor

          # Giải nén trực tiếp vào thư mục hiện tại (không tạo thư mục cha bao bọc)
          echo "[+] Đang giải nén camera.zip..."
          unzip -o camera.zip

          echo "[+] Giải nén hoàn tất. Giữ nguyên file camera.zip!"

      - name: Git Commit & Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage toàn bộ thay đổi (các file mới giải nén và thư mục cũ đã xóa)
          git add drivers/misc/mediatek/

          # Kiểm tra xem có thay đổi nào để commit hay không
          if git diff --staged --quiet; then
            echo "[!] Không có thay đổi nào mới để commit."
          else
            git commit -m "Chore: Update flashlight & imgsensor from camera.zip"
            git push
            echo "[+] Đã push thay đổi lên GitHub thành công!"
          fi
          
