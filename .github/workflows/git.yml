name: Restore KernelSU Git History (Latest)

on:
  workflow_dispatch: # Chạy thủ công trên giao diện GitHub Actions

jobs:
  restore-git:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository hiện tại
        uses: actions/checkout@v4

      - name: Khởi tạo và tải lịch sử Git mới nhất cho KernelSU
        run: |
          KSU_DIR="drivers/KernelSU-0.9.5"

          if [ -d "$KSU_DIR" ]; then
            cd "$KSU_DIR"
            
            # 1. Khởi tạo thư mục .git nếu chưa có
            if [ ! -d ".git" ]; then
              echo "Khởi tạo thư mục .git..."
              git init
              git remote add origin https://github.com/tiann/KernelSU.git
            fi

            # 2. Tải toàn bộ lịch sử commit mới nhất từ branch main của tiann
            echo "Đang tải toàn bộ lịch sử commit mới nhất..."
            git fetch origin main

            # 3. Đặt mốc lịch sử về commit mới nhất trên branch main 
            # Dùng --soft để KHÔNG thay đổi hay đè bất kỳ file mã nguồn ZIP hiện tại nào của bạn
            git reset --soft origin/main

            echo "Đã tạo thư mục .git thành công với lịch sử mới nhất!"
          else
            echo "Lỗi: Không tìm thấy thư mục $KSU_DIR"
            exit 1
          fi
