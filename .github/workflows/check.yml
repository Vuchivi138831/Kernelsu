name: Check MediaTek CPUFreq Constraints

on:
  workflow_dispatch:

jobs:
  scan-source:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Search CPUFreq Drivers for Speed Binning and Capping
      run: |
        echo "==============================================================="
        echo " ĐANG QUÉT CÁC FILE DRIVER CPUFREQ CHÍNH CỦA MEDIATEK"
        echo "==============================================================="
        
        TARGET_FILES=$(find . -type f \( -name "mtk-cpufreq.c" -o -name "mtk-cpufreq-v2.c" -o -name "cpufreq.c" \) | grep -E "drivers/cpufreq|drivers/misc/mediatek")
        
        if [ -z "$TARGET_FILES" ]; then
          echo "⚠️ Không tìm thấy file mtk-cpufreq.c cụ thể. Tiến hành quét diện rộng trong drivers/cpufreq..."
          TARGET_FILES=$(find drivers/cpufreq/ -type f -name "*.c" 2>/dev/null || true)
        fi

        if [ -z "$TARGET_FILES" ]; then
          echo "❌ Lỗi: Không tìm thấy thư mục drivers/cpufreq/ trong repository này."
          exit 1
        fi

        echo "Các file sẽ được phân tích:"
        echo "$TARGET_FILES"
        echo "---------------------------------------------------------------"

        KEYWORDS="efuse|speed_bin|speedbin|binning|g25|g35|p35|mt6765|max_freq|max_support_freq|capping|volt_tracking"

        echo "Kết quả tìm kiếm từ khóa hạn chế xung nhịp:"
        for file in $TARGET_FILES; do
          if [ -f "$file" ]; then
            echo -e "\n🔍 Kiểm tra file: $file"
            grep -E -n -i "$KEYWORDS" "$file" || echo "  -> Không phát hiện từ khóa giới hạn trong file này."
          fi
        done
        echo "==============================================================="

    - name: Broad Scan for MediaTek Power Management (Backup)
      run: |
        echo "==============================================================="
        echo " ĐANG QUÉT RỘNG TRONG THƯ MỤC MEDIATEK POWER (NẾU CÓ)"
        echo "==============================================================="
        
        POWER_DIR="./drivers/misc/mediatek/power"
        if [ -d "$POWER_DIR" ]; then
          echo "Tìm thấy thư mục quản lý nguồn MediaTek. Tiến hành tìm từ khóa..."
          grep -R -E -n -i "g25|g35|speed_bin|max_freq" "$POWER_DIR" || echo "  -> Không tìm thấy từ khóa cản trở xung nhịp trong thư mục power."
        else
          echo "Thư mục $POWER_DIR không tồn tại trong nhánh này, bỏ qua."
        fi
        echo "==============================================================="
        
