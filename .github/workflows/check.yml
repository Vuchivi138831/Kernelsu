name: Deep Scan MediaTek CPUFreq Constraints

on:
  workflow_dispatch:

jobs:
  scan-source:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Global Search for MT6765 Clock and DVFS Files
      run: |
        echo "==============================================================="
        echo " TIẾN HÀNH QUÉT TOÀN DIỆN MÃ NGUỒN TÌM ĐỊNH NGHĨA XUNG NHỊP"
        echo "==============================================================="
        
        # 1. Tìm tất cả các file có khả năng điều khiển xung nhịp MediaTek
        echo "🔎 1. Các file .c liên quan đến mtk, cpufreq hoặc dvfs:"
        find . -type f -name "*.c" | grep -E "cpufreq|dvfs|mtk-freq|mach-mt" || echo "Không tìm thấy file trùng khớp sơ bộ."
        echo "---------------------------------------------------------------"

        # 2. Quét sâu từ khóa trong toàn bộ thư mục drivers/misc/mediatek
        echo "🔎 2. Quét từ khóa giới hạn trong drivers/misc/mediatek/:"
        if [ -d "./drivers/misc/mediatek" ]; then
          grep -R -E -n -i "g25|g35|p35|speed_bin|speedbin" ./drivers/misc/mediatek/ || echo "Không tìm thấy từ khóa trong drivers/misc/mediatek."
        else
          echo "Thư mục drivers/misc/mediatek không tồn tại."
        fi
        echo "==============================================================="

    - name: Scan Architecture Specific Directory (arch/arm64)
      run: |
        echo "==============================================================="
        echo " QUÉT TRONG THƯ MỤC CẤU TRÚC CHÍNH (ARCH/ARM64)"
        echo "==============================================================="
        
        if [ -d "./arch/arm64" ]; then
          echo "🔎 Quét bảng xung nhịp hoặc giới hạn tần số trong arch/arm64:"
          grep -R -E -n -i "1500000|1750000|2001000|g25|g35" ./arch/arm64/mach-mediatek/ 2>/dev/null || \
          grep -R -E -n -i "1500000|1750000|2001000|g25|g35" ./arch/arm64/boot/dts/ 2>/dev/null || \
          echo "Không tìm thấy cấu hình liên quan trong arch/arm64."
        else
          echo "Thư mục arch/arm64 không tồn tại."
        fi
        echo "==============================================================="
        
